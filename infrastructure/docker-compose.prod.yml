version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: phrydlpg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - phrydlpg-network

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - phrydlpg-network

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - phrydlpg-network

  backend:
    image: ${DOCKER_REGISTRY}/phrydlpg-backend:${APP_VERSION:-latest}
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=phrydlpg
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - MINIO_URL=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - minio
      - redis
    networks:
      - phrydlpg-network

  frontend:
    image: ${DOCKER_REGISTRY}/phrydlpg-frontend:${APP_VERSION:-latest}
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - phrydlpg-network

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  phrydlpg-network:
    driver: bridge
