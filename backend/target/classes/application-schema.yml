spring:
  datasource:
    url: jdbc:h2:mem:schematest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: sa
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      jakarta:
        persistence:
          schema-generation:
            scripts:
              action: create
              create-target: schema-export.sql
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
